// ─── BayesianHero helpers ─────────────────────────────────────────────────────
function clamp01(x) { return Math.max(0, Math.min(1, x)); }
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function lerp(a, b, t) { return a + (b - a) * t; }
function makeGaussian(mu, sd, h) { return { mu, sd, h }; }
function combineMu(a, b) {
  const wa = 1 / (a.sd * a.sd), wb = 1 / (b.sd * b.sd);
  return (wa * a.mu + wb * b.mu) / (wa + wb);
}
function combineSd(a, b) {
  return Math.sqrt(1 / (1 / (a.sd * a.sd) + 1 / (b.sd * b.sd)));
}
function distY(d, x) {
  const z = (x - d.mu) / d.sd;
  return d.h * Math.exp(-0.5 * z * z);
}
function distPath(d, W, H, amp) {
  const baseline = H - 18, maxY = H - 28 - 18, N = 180;
  let out = `M 0 ${baseline}`;
  for (let i = 0; i <= N; i++) {
    const x = i / N;
    out += ` L ${(x * W).toFixed(1)} ${(baseline - distY(d, x) * maxY * amp).toFixed(1)}`;
  }
  return out + ` L ${W} ${baseline} Z`;
}
function strokePath(d, W, H, amp) {
  const baseline = H - 18, maxY = H - 28 - 18, N = 180;
  let out = '';
  for (let i = 0; i <= N; i++) {
    const x = i / N;
    out += (i === 0 ? 'M' : 'L') + ` ${(x * W).toFixed(1)} ${(baseline - distY(d, x) * maxY * amp).toFixed(1)} `;
  }
  return out;
}

// ─── BayesianHero component ───────────────────────────────────────────────────
function BayesianHero({ color = '#7a1a1a', accent = '#2b3f6b', height = 220, seed = 0 }) {
  const W = 780, H = height;
  const [t, setT] = React.useState(0.6);
  React.useEffect(() => {
    const key = 'jn_hero_played_' + seed;
    try { if (sessionStorage.getItem(key)) { setT(1); return; } } catch(e) {}
    let raf;
    const start = performance.now();
    const tick = (now) => {
      const p = Math.min(1, (now - start) / 2600);
      setT(p);
      if (p < 1) raf = requestAnimationFrame(tick);
      else { try { sessionStorage.setItem(key, '1'); } catch(e) {} }
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [seed]);

  const e1 = easeOutCubic(clamp01(t / 0.45));
  const e2 = easeOutCubic(clamp01((t - 0.35) / 0.45));
  const e3 = easeOutCubic(clamp01((t - 0.55) / 0.45));
  const prior     = makeGaussian(0.50, 0.17, 1.0);
  const likelihood = makeGaussian(0.62, 0.09, 1.25);
  const postMu    = lerp(prior.mu, combineMu(prior, likelihood), e3);
  const postSd    = lerp(prior.sd, combineSd(prior, likelihood), e3);
  const posterior = makeGaussian(postMu, postSd, 1.45);

  return (
    <svg viewBox={`0 -${Math.round(H * 0.42)} ${W} ${Math.round(H * 1.95)}`} width="100%" height="auto" style={{ display: 'block' }}>
      <defs>
        <linearGradient id={`jn-prior-${seed}`} x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stopColor={color} stopOpacity="0.18" /><stop offset="1" stopColor={color} stopOpacity="0" />
        </linearGradient>
        <linearGradient id={`jn-like-${seed}`} x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stopColor={accent} stopOpacity="0.22" /><stop offset="1" stopColor={accent} stopOpacity="0" />
        </linearGradient>
        <linearGradient id={`jn-post-${seed}`} x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stopColor={color} stopOpacity="0.55" /><stop offset="1" stopColor={color} stopOpacity="0.04" />
        </linearGradient>
      </defs>
      <line x1="0" y1={H - 18} x2={W} y2={H - 18} stroke={color} strokeWidth="0.5" strokeOpacity="0.35" />
      <path d={distPath(prior, W, H, e1)} fill={`url(#jn-prior-${seed})`} />
      <path d={strokePath(prior, W, H, e1)} fill="none" stroke={color} strokeOpacity="0.5" strokeWidth="1" />
      <path d={distPath(likelihood, W, H, e2)} fill={`url(#jn-like-${seed})`} />
      <path d={strokePath(likelihood, W, H, e2)} fill="none" stroke={accent} strokeOpacity="0.6" strokeWidth="1" strokeDasharray="3 2" />
      <path d={distPath(posterior, W, H, e3)} fill={`url(#jn-post-${seed})`} />
      <path d={strokePath(posterior, W, H, e3)} fill="none" stroke={color} strokeWidth="1.6" />
    </svg>
  );
}

// ─── CircledWord ──────────────────────────────────────────────────────────────
function CircledWord({ children, color = '#7a1a1a', stroke = 2, tilt = -4, pad = 10 }) {
  const ref = React.useRef(null);
  const [box, setBox] = React.useState(null);
  React.useLayoutEffect(() => {
    if (!ref.current) return;
    const r = ref.current.getBoundingClientRect();
    setBox({ w: r.width, h: r.height });
  }, [children]);
  return (
    <span ref={ref} style={{ position: 'relative', display: 'inline-block', padding: `0 ${pad}px` }}>
      <span style={{ position: 'relative', zIndex: 2 }}>{children}</span>
      {box && (
        <svg width={box.w} height={box.h} viewBox={`0 0 ${box.w} ${box.h}`}
          style={{ position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'visible', transform: `rotate(${tilt}deg)` }}>
          <ellipse cx={box.w / 2} cy={box.h / 2} rx={box.w / 2 - 2} ry={box.h / 2 - 1}
            fill="none" stroke={color} strokeWidth={stroke} />
        </svg>
      )}
    </span>
  );
}

function useRoute() {
  const parse = () => {
    const h = window.location.hash.slice(1);
    if (!h) return { page: 'home' };
    const [page, id] = h.split('/');
    return { page, id };
  };
  const [route, setRoute] = React.useState(parse);
  React.useEffect(() => {
    const onHash = () => setRoute(parse());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  const nav = (page, id) => {
    window.location.hash = id ? `${page}/${id}` : page;
    window.scrollTo(0, 0);
  };
  return [route, nav];
}

        <h1 style={{ fontFamily: fonts.serif, fontSize: 'clamp(40px, 6vw, 64px)', lineHeight: 1.05, fontWeight: 400, letterSpacing: '-0.01em', margin: '0 0 20px', color: JN.ink }}>

        </h1>
        <p style={{ fontFamily: fonts.serif, fontSize: 20, lineHeight: 1.5, color: JN.inkSoft, margin: '0 0 32px', fontStyle: 'italic' }}>
          with worked examples, after Turkman, Paulino &amp; M&uuml;ller.
        </p>
        <SashikoRule color={JN.red} opacity={1} width={80} my={8} />
        <P style={{ margin: '28px 0 40px' }}>
          This is a reading companion, not a textbook. I wrote it while working through <em>Computational Bayesian Statistics, An Introduction</em>, and kept it public so that another student starting the same book might have a slightly shorter road. This guide is a work in progress and likely contains mistakes; please <a href="mailto:janguye5@uci.edu" style={{ color: JN.red }}>write to me</a> with any corrections.
        </P>

        <div style={{ fontFamily: fonts.sans, fontSize: 11, color: JN.muteCool, letterSpacing: '0.18em', textTransform: 'uppercase', marginBottom: 16 }}>Contents</div>
        {[
          ['I',   'Bayes, in brief'],

        ].map(([n, title]) => (

        ))}

        {/* ── Chapter I ── */}
        <div style={{ marginTop: 64, borderTop: `1px solid ${JN.rule}`, paddingTop: 48 }}>
          <div style={{ fontFamily: fonts.serif, fontStyle: 'italic', fontSize: 14, color: JN.red, marginBottom: 8 }}>Chapter I</div>
          <h2 style={{ fontFamily: fonts.serif, fontSize: 36, fontWeight: 400, letterSpacing: '-0.01em', margin: '0 0 32px', color: JN.ink }}>
            Bayes, in brief
          </h2>

          <P>
            There are two major ideologies that dominate modern statistics: <strong>Frequentist</strong> (Classical) and <strong>Bayesian</strong> statistics. Throughout this chapter we discuss how Thomas Bayes&rsquo; perspective contrasts the assumptions and interpretations of the more commonly taught Frequentist approach.
          </P>

          <P>
            First, recall the structure of Frequentist inference. Suppose there exists some unknown true parameter vector {'\\( \\theta^* \\in \\Theta \\)'} that explains the relationship between a random variable {'\\( X \\)'} following some distribution {'\\( F \\)'}. Let {'\\( x = (x_1, \\dots, x_n) \\in \\mathcal{X} \\)'} denote the observed data generated from {'\\( X \\)'} with sample size {'\\( n \\)'}.
          </P>

          <Eq>{'\\[ X \\sim F(\\theta^*), \\quad x = (x_1, \\dots, x_n) \\in \\mathcal{X} \\]'}</Eq>

          <P>
            Frequentist inference quantifies the probability of observing a sample as extreme or more extreme than {'\\( x \\)'} under a hypothesized distribution {'\\( F \\)'}. For some hypothesized parameter {'\\( \\theta_0 \\)'}, we are interested in the <em>frequency</em> of obtaining a sample as extreme as our observed data over many repeated samples. This is the inspiration for the name &ldquo;Frequentist,&rdquo; and it yields a confidence interval for {'\\( \\theta \\)'} believed to contain the true parameter {'\\( \\theta^* \\)'} with some confidence level.
          </P>

          <P>
            Frequentist ideology assumes the existence of a true constant parameter {'\\( \\theta^* \\)'} that objectively describes the distribution of the data, and it relies on confidence intervals that lack axiomatic interpretations in probability calculus. Bayesian inference addresses these concerns by treating the parameter as a <em>random variable</em> informed by the observed data. Bayesians make claims about the distribution of the parameter itself, derived directly from the axioms of probability, and iterative learning allows the model to adapt as new data affirms or contradicts prior beliefs.
          </P>

          <P>
            This branch of inference follows Thomas Bayes&rsquo; concept of a <strong>posterior distribution</strong> dependent on the <strong>likelihood</strong> of the observed data and a <strong>prior distribution</strong> encoding beliefs about the parameter before any data is seen. A priori information may be sourced from previous studies, expert knowledge, or subjective belief. Bayes&rsquo; theorem states:
          </P>

          <Eq>{`\\[
            \\begin{align*}
              {\\color{#7a1a1a}\\text{Posterior}} &= \\frac{{\\color{#2b3f6b}\\text{Likelihood}} \\times {\\color{#5e1515}\\text{Prior}}}{{\\color{#6e655a}\\text{Marginal}}} \\\\
              {\\color{#7a1a1a}P(\\theta \\mid x)} &= \\frac{{\\color{#2b3f6b}L(x \\mid \\theta)}\\,{\\color{#5e1515}P(\\theta)}}{{\\color{#6e655a}P(x)}}, \\quad L(x \\mid \\theta) = \\prod_{i=1}^n f(x_i \\mid \\theta) \\\\
              &= \\begin{cases}
                \\dfrac{{\\color{#2b3f6b}L(x \\mid \\theta)}\\,{\\color{#5e1515}P(\\theta)}}{{\\color{#6e655a}\\int_\\theta L(x \\mid \\theta)\\,P(\\theta)\\,d\\theta}} & X \\text{ continuous} \\\\[10pt]
                \\dfrac{{\\color{#2b3f6b}L(x \\mid \\theta)}\\,{\\color{#5e1515}P(\\theta)}}{{\\color{#6e655a}\\sum_\\theta L(x \\mid \\theta)\\,P(\\theta)}} & X \\text{ discrete}
              \\end{cases}
            \\end{align*}
          \\]`}</Eq>

          <P>
            The normalizing constant {'\\( P(x) \\)'} ensures the posterior integrates to 1, making it a valid probability distribution. We often call it the <em>marginal likelihood</em> or <em>evidence</em>.
          </P>

          <P>
            The goal of Bayesian inference is to obtain a credible interval {'\\( C(x) \\)'} such that {'\\( P(\\theta \\in C(x) \\mid x) = 1 - \\alpha \\)'} under the assumed model. Although different prior choices yield different credible intervals, posterior distributions with varying priors converge as sample size increases&mdash;a desirable property known as <strong>asymptotic consistency</strong>. Methods for constructing credible intervals, which are often not unique, will be discussed later in the text.
          </P>

          <P>
            Bayesian inference also invites iterative learning: replacing the prior with the most recent posterior yields an adaptive model that reflects accumulated beliefs as new data arrives. This contrasts sharply with the Frequentist interpretation of a fixed, cross-sectional parameter estimate.
          </P>
        </div>

        <div style={{ marginTop: 56, padding: '20px 0', fontFamily: fonts.serif, fontStyle: 'italic', fontSize: 14, color: JN.mute, textAlign: 'center', borderTop: `1px dashed ${JN.ruleSoft}` }}>
          Chapters II&ndash;VI in progress.
        </div>

        <div style={{ marginTop: 24, textAlign: 'center' }}>
          <button onClick={() => nav('instruction')} style={{ all: 'unset', cursor: 'pointer', fontFamily: fonts.serif, fontStyle: 'italic', color: JN.red, fontSize: 16 }}>
            &larr; back to instruction
          </button>
        </div>
      </div>
      <SheetFooter fonts={fonts} />
    </div>
  );
}

// ─── CV ───────────────────────────────────────────────────────────────────────
function CVBlueprint({ nav }) {
  const fonts = B_FONTS;
  const cv = window.JN_DATA.cv;
  const roman = (n) => ({ '01': 'I', '02': 'II', '03': 'III', '04': 'IV' }[n] || n);
  const Block = ({ n, title, rows }) => (
    <div style={{ marginBottom: 56 }}>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 16, marginBottom: 20 }}>
        <span style={{ fontFamily: fonts.serif, fontStyle: 'italic', fontSize: 18, color: JN.red }}>&sect; {roman(n)}</span>
        <SashikoRule color={JN.red} opacity={1} width={32} />
        <h2 style={{ fontFamily: fonts.serif, fontSize: 32, fontWeight: 400, letterSpacing: '-0.01em', margin: 0, color: JN.ink }}>{title}</h2>
      </div>
      <div>
        {rows.map((r, i) => (
          <div key={i} className="jn-grid-cv" style={{ display: 'grid', gridTemplateColumns: '120px 1fr 1fr', padding: '16px 0', borderBottom: i < rows.length - 1 ? `1px dashed ${JN.ruleSoft}` : 'none', alignItems: 'baseline', gap: 24 }}>
            <span style={{ fontFamily: fonts.serif, fontStyle: 'italic', fontSize: 14, color: JN.mute }}>{r.year}</span>
            <div>
              <div style={{ fontFamily: fonts.serif, fontSize: 19, color: JN.ink }}>{r.title}</div>
              {r.inst && <div style={{ fontFamily: fonts.serif, fontSize: 15, color: JN.inkSoft, marginTop: 2, fontStyle: 'italic' }}>{r.inst}</div>}
            </div>
            <div className="jn-cv-note" style={{ fontFamily: fonts.serif, fontSize: 15, color: JN.mute, lineHeight: 1.55 }}>{r.note || ''}</div>
          </div>
        ))}
      </div>
    </div>
  );
  return (
    <div style={{ ...BG(), color: JN.ink, fontFamily: fonts.serif, minHeight: '100%' }}>
      <TopNav fonts={fonts} nav={nav} active="cv" />
      <div className="jn-cv-content" style={{ maxWidth: 1080, margin: '0 auto', padding: '72px 72px' }}>
        <div className="jn-grid-2col" style={{ display: 'grid', gridTemplateColumns: '1fr auto', gap: 40, alignItems: 'end', marginBottom: 48 }}>
          <div>
            <div style={{ fontFamily: fonts.serif, fontStyle: 'italic', fontSize: 15, color: JN.mute, marginBottom: 12 }}>Curriculum vitae</div>
            <h1 style={{ fontFamily: fonts.serif, fontSize: 'clamp(40px, 6vw, 72px)', lineHeight: 1, fontWeight: 400, letterSpacing: '-0.02em', margin: 0, color: JN.ink }}>
              James A. <em>Nguyen</em>
            </h1>
            <div style={{ fontFamily: fonts.serif, fontSize: 15, color: JN.mute, marginTop: 16, fontStyle: 'italic' }}>
              UC Irvine &middot; PhD Statistics, class of 2031 &middot; janguye5@uci.edu
            </div>
          </div>
          <a href="files/nguyenJames_cv.pdf" target="_blank" rel="noopener" style={{ display: 'inline-block', padding: '10px 18px', borderBottom: `1px solid ${JN.red}`, color: JN.red, fontFamily: fonts.serif, fontStyle: 'italic', fontSize: 16, textDecoration: 'none' }}>
            download PDF &darr;
          </a>
        </div>

        <SashikoRule color={JN.red} opacity={1} />
        <div style={{ height: 40 }} />

        <Block n="01" title="Education" rows={cv.education} />
        <Block n="02" title="Research" rows={cv.research} />
        <Block n="03" title="Awards" rows={cv.awards} />
        <Block n="04" title="Teaching" rows={cv.teaching} />

        <div style={{ marginTop: 32, padding: '24px 0', fontFamily: fonts.serif, fontStyle: 'italic', fontSize: 15, color: JN.mute, textAlign: 'center' }}>
          Full CV as PDF, <a href="files/nguyenJames_cv.pdf" target="_blank" rel="noopener" style={{ color: JN.red }}>files/nguyenJames_cv.pdf</a>
        </div>
      </div>
      <SheetFooter fonts={fonts} />
    </div>
  );
}

// ─── Collaborators ────────────────────────────────────────────────────────────
function CollaboratorsBlueprint({ nav }) {
  const fonts = B_FONTS;
  const sections = window.JN_DATA.collaboratorSections;
  return (
    <div style={{ ...BG(), color: JN.ink, fontFamily: fonts.serif, minHeight: '100%', position: 'relative' }}>
      <TopNav fonts={fonts} nav={nav} active="collaborators" />
      <section className="jn-collab-section" style={{ maxWidth: 1080, margin: '0 auto', padding: '72px 72px', position: 'relative' }}>
        <Komorebi opacity={0.4} />
        <div style={{ fontFamily: fonts.serif, fontStyle: 'italic', fontSize: 15, color: JN.mute, marginBottom: 16, position: 'relative' }}>Collaborators</div>
        <h1 style={{ fontFamily: fonts.serif, fontSize: 'clamp(40px, 6vw, 72px)', lineHeight: 1.05, fontWeight: 400, letterSpacing: '-0.02em', margin: '0 0 48px', color: JN.ink, maxWidth: 900, position: 'relative' }}>
          People I&rsquo;ve had the fortune to work with.
        </h1>
        <SashikoRule color={JN.red} opacity={1} />
        {sections.map((sec, si) => (
          <div key={sec.heading} style={{ marginTop: si === 0 ? 8 : 48 }}>
            <div style={{ fontFamily: fonts.sans, fontSize: 11, letterSpacing: '0.18em', textTransform: 'uppercase', color: JN.muteCool, marginBottom: 4, paddingTop: si > 0 ? 0 : 0 }}>
              {sec.heading}
            </div>
            {sec.members.map((c, i) => (
              <div key={c.name} className="jn-grid-collab" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', padding: '18px 0', borderBottom: `1px dashed ${JN.ruleSoft}`, alignItems: 'baseline', gap: 20 }}>
                <span style={{ fontFamily: fonts.serif, fontSize: 20, color: JN.ink }}>{c.name}</span>
                <span className="jn-collab-meta" style={{ fontFamily: fonts.serif, fontStyle: 'italic', fontSize: 15, color: JN.mute }}>{c.note}</span>
                <span className="jn-collab-meta" style={{ fontFamily: fonts.serif, fontSize: 15, color: JN.inkSoft }}>{c.inst}</span>
              </div>
            ))}
          </div>
        ))}
        <p style={{ fontFamily: fonts.serif, fontSize: 17, color: JN.inkSoft, fontStyle: 'italic', marginTop: 48, maxWidth: 720, lineHeight: 1.6 }}>
          Collaboration is the quiet engine of academic work. If you think there&rsquo;s a useful overlap with what you&rsquo;re working on, <a href="mailto:janguye5@uci.edu" style={{ color: JN.red }}>please write</a>.
        </p>
      </section>
      <SheetFooter fonts={fonts} />
    </div>
  );
}

// ─── App root ─────────────────────────────────────────────────────────────────
function App() {
  const [route, nav] = useRoute();
  React.useEffect(() => {
    (document.scrollingElement || document.documentElement).scrollTo?.(0, 0);
  }, [route.page, route.id]);

  if (route.page === 'project')       return <ProjectDetailEditorial id={route.id} nav={nav} />;
  if (route.page === 'instruction')   return <InstructionBlueprint nav={nav} />;
  if (route.page === 'cv')            return <CVBlueprint nav={nav} />;
  if (route.page === 'collaborators') return <CollaboratorsBlueprint nav={nav} />;
  if (route.page === 'guide')         return <GuideBlueprint nav={nav} />;
  return <HomeBlueprint nav={nav} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
