// ─── BayesianHero helpers ─────────────────────────────────────────────────────
function clamp01(x) { return Math.max(0, Math.min(1, x)); }
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function lerp(a, b, t) { return a + (b - a) * t; }
function makeGaussian(mu, sd, h) { return { mu, sd, h }; }
function combineMu(a, b) {
  const wa = 1 / (a.sd * a.sd), wb = 1 / (b.sd * b.sd);
  return (wa * a.mu + wb * b.mu) / (wa + wb);
}
function combineSd(a, b) {
  return Math.sqrt(1 / (1 / (a.sd * a.sd) + 1 / (b.sd * b.sd)));
}
function distY(d, x) {
  const z = (x - d.mu) / d.sd;
  return d.h * Math.exp(-0.5 * z * z);
}
function distPath(d, W, H, amp) {
  const baseline = H - 18, maxY = H - 28 - 18, N = 180;
  let out = `M 0 ${baseline}`;
  for (let i = 0; i <= N; i++) {
    const x = i / N;
    out += ` L ${(x * W).toFixed(1)} ${(baseline - distY(d, x) * maxY * amp).toFixed(1)}`;
  }
  return out + ` L ${W} ${baseline} Z`;
}
function strokePath(d, W, H, amp) {
  const baseline = H - 18, maxY = H - 28 - 18, N = 180;
  let out = '';
  for (let i = 0; i <= N; i++) {
    const x = i / N;
    out += (i === 0 ? 'M' : 'L') + ` ${(x * W).toFixed(1)} ${(baseline - distY(d, x) * maxY * amp).toFixed(1)} `;
  }
  return out;
}

// ─── BayesianHero component ───────────────────────────────────────────────────
function BayesianHero({ color = '#7a1a1a', accent = '#2b3f6b', height = 220, seed = 0 }) {
  const W = 780, H = height;
  const [t, setT] = React.useState(0);
  React.useEffect(() => {
    const key = 'jn_hero_played_' + seed;
    if (sessionStorage.getItem(key)) { setT(1); return; }
    let raf;
    const start = performance.now();
    const tick = (now) => {
      const p = Math.min(1, (now - start) / 2600);
      setT(p);
      if (p < 1) raf = requestAnimationFrame(tick);
      else sessionStorage.setItem(key, '1');
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [seed]);

  const e1 = easeOutCubic(clamp01(t / 0.45));
  const e2 = easeOutCubic(clamp01((t - 0.35) / 0.45));
  const e3 = easeOutCubic(clamp01((t - 0.55) / 0.45));
  const prior     = makeGaussian(0.50, 0.17, 1.0);
  const likelihood = makeGaussian(0.62, 0.09, 1.25);
  const postMu    = lerp(prior.mu, combineMu(prior, likelihood), e3);
  const postSd    = lerp(prior.sd, combineSd(prior, likelihood), e3);
  const posterior = makeGaussian(postMu, postSd, 1.45);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="auto" style={{ display: 'block', overflow: 'visible' }}>
      <defs>
        <linearGradient id={`jn-prior-${seed}`} x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stopColor={color} stopOpacity="0.18" /><stop offset="1" stopColor={color} stopOpacity="0" />
        </linearGradient>
        <linearGradient id={`jn-like-${seed}`} x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stopColor={accent} stopOpacity="0.22" /><stop offset="1" stopColor={accent} stopOpacity="0" />
        </linearGradient>
        <linearGradient id={`jn-post-${seed}`} x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stopColor={color} stopOpacity="0.55" /><stop offset="1" stopColor={color} stopOpacity="0.04" />
        </linearGradient>
      </defs>
      <line x1="0" y1={H - 18} x2={W} y2={H - 18} stroke={color} strokeWidth="0.5" strokeOpacity="0.35" />
      <path d={distPath(prior, W, H, e1)} fill={`url(#jn-prior-${seed})`} />
      <path d={strokePath(prior, W, H, e1)} fill="none" stroke={color} strokeOpacity="0.5" strokeWidth="1" />
      <path d={distPath(likelihood, W, H, e2)} fill={`url(#jn-like-${seed})`} />
      <path d={strokePath(likelihood, W, H, e2)} fill="none" stroke={accent} strokeOpacity="0.6" strokeWidth="1" strokeDasharray="3 2" />
      <path d={distPath(posterior, W, H, e3)} fill={`url(#jn-post-${seed})`} />
      <path d={strokePath(posterior, W, H, e3)} fill="none" stroke={color} strokeWidth="1.6" />
      <g transform={`translate(0 ${H - 18}) scale(1 -0.35)`} opacity="0.18">
        <path d={strokePath(posterior, W, H, e3)} fill="none" stroke={color} strokeWidth="1.2" />
      </g>
    </svg>
  );
}

// ─── CircledWord ──────────────────────────────────────────────────────────────
function CircledWord({ children, color = '#7a1a1a', stroke = 2, tilt = -4, pad = 10 }) {
  const ref = React.useRef(null);
  const [box, setBox] = React.useState(null);
  React.useLayoutEffect(() => {
    if (!ref.current) return;
    const r = ref.current.getBoundingClientRect();
    setBox({ w: r.width, h: r.height });
  }, [children]);
  return (
    <span ref={ref} style={{ position: 'relative', display: 'inline-block', padding: `0 ${pad}px` }}>
      <span style={{ position: 'relative', zIndex: 2 }}>{children}</span>
      {box && (
        <svg width={box.w} height={box.h} viewBox={`0 0 ${box.w} ${box.h}`}
          style={{ position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'visible', transform: `rotate(${tilt}deg)` }}>
          <ellipse cx={box.w / 2} cy={box.h / 2} rx={box.w / 2 - 2} ry={box.h / 2 - 1}
            fill="none" stroke={color} strokeWidth={stroke} />
        </svg>
      )}
    </span>
  );
}

// ─── Routing ──────────────────────────────────────────────────────────────────
function useRoute() {
  const parse = () => {
    const h = window.location.hash.slice(1);
    if (!h) return { page: 'home' };
    const [page, id] = h.split('/');
    return { page, id };
  };
  const [route, setRoute] = React.useState(parse);
  React.useEffect(() => {
    const onHash = () => setRoute(parse());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  const nav = (page, id) => {
    window.location.hash = id ? `${page}/${id}` : page;
    window.scrollTo(0, 0);
  };
  return [route, nav];
}

// ─── App root ─────────────────────────────────────────────────────────────────
function App() {
  const [route, nav] = useRoute();
  React.useEffect(() => {
    (document.scrollingElement || document.documentElement).scrollTo?.(0, 0);
  }, [route.page, route.id]);

  if (route.page === 'project')       return <ProjectDetailEditorial id={route.id} nav={nav} />;
  if (route.page === 'instruction')   return <InstructionBlueprint nav={nav} />;
  if (route.page === 'cv')            return <CVBlueprint nav={nav} />;
  if (route.page === 'collaborators') return <CollaboratorsBlueprint nav={nav} />;
  if (route.page === 'guide')         return <GuideBlueprint nav={nav} />;
  return <HomeBlueprint nav={nav} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
